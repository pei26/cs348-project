<!DOCTYPE html>
<html>
<head>
    <title>Create Meeting</title>
</head>
<body>
    <h1>Create Meeting</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}  <!-- This renders all fields, including club and room as dropdowns -->

        <label for="organizers">Select Meeting Organizers:</label><br>
        <select name="organizers" id="organizers" multiple>
            {% for student in students %}
                <option value="{{ student.id }}">{{ student.name }}</option>
            {% endfor %}
        </select><br><br>

        <button type="submit">Save Meeting</button>
    </form>
</body>
</html>
